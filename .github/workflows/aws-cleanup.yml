name: AWS Test Resource Cleanup

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    # Safety net: run every 6 hours to catch any orphaned resources
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Leave headroom for cleanup to report its own deadline before job cancellation.
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-west-1
      AWS_DEFAULT_OUTPUT: json
      # The name sweep matches most of what the AWS suites create, so it could delete topics and
      # queues out from under a job that is still running. The guard applies on every trigger, not
      # just the schedule: CI runs on every push and every pull request and declares no concurrency
      # group, so the run that just finished is never the only one in the account.
      #
      # What this defers is a leak from a run that died, by up to an hour: the sweep fires again on
      # the next CI completion, and the six-hourly schedule is the floor. Providers reap their own
      # resources now, so the sweep is a backstop rather than the mechanism.
      CLEANUP_MIN_AGE_SECONDS: 3600
      CLEANUP_TIMEOUT_SECONDS: 1500

    steps:
      - uses: actions/checkout@v7

      - name: Wait for tag propagation
        # The AWS Resource Groups Tagging API is eventually consistent.
        # Resources created shortly before CI completes may not yet be discoverable by tag.
        # 15 seconds provides sufficient margin based on observed propagation times.
        run: sleep 15

      - name: Cleanup orphaned test resources
        run: |
          chmod +x ./clean_failed_tests_aws_assets.sh
          ./clean_failed_tests_aws_assets.sh
