# Setup and SDK reference: https://local.cloud/docs/github-actions/
# Laptop: python3 scripts/localcloud-test.py (add --full-suite for regression tests).
# Enable pull-request runs with repository variable LOCALCLOUD_CI_ENABLED=true.
name: LocalCloud tests
'on':
  workflow_dispatch: null
  pull_request: null
permissions:
  contents: read
jobs:
  localcloud:
    if: github.event_name == 'workflow_dispatch' || vars.LOCALCLOUD_CI_ENABLED ==
      'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      localcloud:
        image: agentcloud/localcloud@sha256:88e85b86b294e1e4f71b8c63ec43de79d170946ff39556f0e2709f66aa0d368c
        env:
          LOCALCLOUD_SERVICES: firestore,gcs
          LOCALCLOUD_PROJECT: localcloud-ci
          LOCALCLOUD_DOCKER_ACCESS: 'false'
          LOCALCLOUD_TELEMETRY: 'false'
        ports:
        - 5380:5380
        - 5382:5382
        - 5384:5384
        - 5392:5392
        options: --memory 4g --health-cmd "curl -fsS http://127.0.0.1:5380/projects
          >/dev/null" --health-interval 5s --health-timeout 5s --health-retries 60
          --health-start-period 30s
    env:
      LOCALCLOUD_TEST: '1'
      GOOGLE_CLOUD_PROJECT: localcloud-ci
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Set up LocalCloud (v0.1.0)
      id: localcloud
      uses: agent-local-cloud/setup-localcloud@de6d236db036be4c8b96879392d22a1feb5047c6
      with:
        services: firestore,gcs
        project-id: localcloud-ci
        runtime-url: http://127.0.0.1:5380
    - name: Build project (1)
      run: bash scripts/localcloud-build.sh
      working-directory: .
      env:
        LOCALCLOUD_GATEWAY_URL: ${{ steps.localcloud.outputs.runtime-url }}
    - name: Build project (2)
      run: python3 -B -m unittest discover -s scripts -p 'test_localcloud_*.py' -v
      working-directory: .
      env:
        LOCALCLOUD_GATEWAY_URL: ${{ steps.localcloud.outputs.runtime-url }}
    - name: Build project (3)
      run: bash scripts/localcloud-build.sh --dotnet list tests/Paramore.Brighter.Gcp.Tests/Paramore.Brighter.Gcp.Tests.csproj
        package --include-transitive --no-restore
      working-directory: .
      env:
        LOCALCLOUD_GATEWAY_URL: ${{ steps.localcloud.outputs.runtime-url }}
    - name: Build project (4)
      run: bash scripts/localcloud-build.sh --dotnet test tests/Paramore.Brighter.Test.Generator.Tests/Paramore.Brighter.Test.Generator.Tests.csproj
        -c Release --no-restore --no-build -f net10.0 --logger GitHubActions --verbosity
        quiet
      working-directory: .
      env:
        LOCALCLOUD_GATEWAY_URL: ${{ steps.localcloud.outputs.runtime-url }}
    - name: Build project (5)
      run: bash scripts/localcloud-build.sh --dotnet test tests/Paramore.Brighter.TickerQ.Tests/Paramore.Brighter.TickerQ.Tests.csproj
        --filter 'Fragile!=CI' --configuration Release --no-restore --no-build --verbosity
        quiet --logger 'console;verbosity=minimal'
      working-directory: .
      env:
        LOCALCLOUD_GATEWAY_URL: ${{ steps.localcloud.outputs.runtime-url }}
    - name: Build project (6)
      run: python3 -B scripts/localcloud-tests.py collect
      working-directory: .
      env:
        LOCALCLOUD_GATEWAY_URL: ${{ steps.localcloud.outputs.runtime-url }}
    - name: Run LocalCloud tests
      run: python3 -B scripts/localcloud-tests.py dedicated tests/Paramore.Brighter.Gcp.Tests/Transformers
        tests/Paramore.Brighter.Gcp.Tests/Firestore/Inbox tests/Paramore.Brighter.Gcp.Tests/Outbox/Firestore/Generated/Sync/When_Adding_A_Message_It_Should_Be_Stored_With_All_Properties.cs
        tests/Paramore.Brighter.Gcp.Tests/Outbox/Firestore/Generated/Async/When_Adding_A_Message_It_Should_Be_Stored_With_All_Properties_Async.cs
      working-directory: .
      env:
        LOCALCLOUD_GATEWAY_URL: ${{ steps.localcloud.outputs.runtime-url }}
