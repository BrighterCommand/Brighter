version: '3.8'

services:
  # Matches the image rabbitmq-async-ci runs. Note that rabbitmq-sync-ci is still on
  # brightercommand/rabbitmq:3.13-management-delay, so this file no longer mirrors that job:
  # a sync-only failure in CI may not reproduce against this broker.
  rabbitmq:
    image: brightercommand/rabbitmq:4.2-management-delay
    hostname: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq

volumes:
  rabbitmq_data:
  rabbitmq_logs:
